# Nginx site for the Smart Library System. setup_vps.sh replaces __DOMAIN__ and Certbot adds HTTPS.

# Slows down password guessing on the login endpoint (10 attempts/minute per address, small burst).
limit_req_zone $binary_remote_addr zone=smartlib_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 6m;          # book covers / face photos are limited to 5 MB by the app

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/auth/login {
        limit_req zone=smartlib_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so a visitor cannot fake their address; the app trusts exactly one proxy hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
