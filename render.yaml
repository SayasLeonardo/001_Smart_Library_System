services:
  - type: web
    name: smart-library
    runtime: python
    plan: free
    region: oregon           # same region as your library-db so the internal database URL works
    buildCommand: pip install -r requirements.txt && python backend/face_enrollment.py
    startCommand: gunicorn --chdir backend app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false          # paste the Internal Database URL of library-db when Render asks
      - key: SMART_LIBRARY_SECRET
        generateValue: true
      - key: SMART_LIBRARY_IOT_KEY
        generateValue: true